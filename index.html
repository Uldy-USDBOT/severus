<title>Severus.ly</title>
<style>
:root{color-scheme:dark;--bg:#0b0908;--gold:#d8b45a;--gold-hi:#f0d98f;--ink:#1a1306;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg)}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3vh,28px);padding:16px;font-family:"Segoe UI","Noto Naskh Arabic",Tahoma,sans-serif}
img{display:block;max-width:100%;max-height:calc(100% - 90px);width:auto;height:auto;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px rgba(216,180,90,.25);object-fit:contain;min-height:0}
a.buy{flex:none;display:inline-block;padding:16px 56px;border-radius:999px;background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--ink);font-size:1.25rem;font-weight:700;text-decoration:none;box-shadow:0 8px 24px rgba(216,180,90,.25);transition:transform .15s,box-shadow .15s}
a.buy:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(216,180,90,.4)}
a.buy:focus-visible{outline:3px solid #fff;outline-offset:4px}
</style>
